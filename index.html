<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Combate à Fake News — Tempo Real</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; background: #ffffff; border-radius: 12px; border: 1px solid #cbd5e1; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .header-bar { background: #0f172a; color: #ffffff; padding: 20px; border-bottom: 4px solid #38bdf8; }
        .header-bar h1 { font-size: 1.4rem; color: #38bdf8; }
        .content { padding: 20px; }
        .input-group { margin-bottom: 15px; }
        label { font-size: 0.85rem; font-weight: bold; color: #475569; display: block; margin-bottom: 5px; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #94a3b8; border-radius: 6px; font-size: 0.95rem; }
        textarea { height: 100px; resize: vertical; }
        .btn-analyze { background-color: #0284c7; color: white; font-weight: bold; padding: 12px 20px; border-radius: 6px; border: none; cursor: pointer; width: 100%; font-size: 1rem; }
        .btn-analyze:hover { background-color: #0369a1; }
        .result-panel { margin-top: 20px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 15px; display: none; }
        .badge { padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; display: inline-block; margin-bottom: 10px; }
        .badge-danger { background-color: #fef2f2; color: #991b1b; border: 1px solid #f87171; }
        .badge-success { background-color: #f0fdf4; color: #166534; border: 1px solid #4ade80; }
        .badge-warning { background-color: #fffbeb; color: #92400e; border: 1px solid #facc15; }
        .diagnosis-text { font-size: 0.95rem; line-height: 1.5; color: #334155; white-space: pre-line; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h1>🛡️ Verificador de Fake News em Tempo Real</h1>
            <p>Análise de credibilidade baseada em Inteligência Artificial</p>
        </div>

        <div class="content">
            <div class="input-group">
                <label for="apiKey">CHAVE DA API OPENAI (sk-...):</label>
                <input type="text" id="apiKey" placeholder="Cole sua chave sk-... aqui para ativar a IA em tempo real">
            </div>

            <div class="input-group">
                <label for="inputText">TEXTO DA NOTÍCIA OU ALEGAÇÃO:</label>
                <textarea id="inputText" placeholder="Cole a notícia que deseja verificar..."></textarea>
            </div>

            <button class="btn-analyze" id="btnAnalyze" onclick="analisarEmTempoReal()">🔍 ANALISAR AGORA COM IA</button>

            <div id="resultPanel" class="result-panel">
                <div id="badgeVerdict" class="badge"></div>
                <div id="diagnosisText" class="diagnosis-text"></div>
            </div>
        </div>
    </div>

    <script>
        async function analisarEmTempoReal() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const text = document.getElementById('inputText').value.trim();
            const btn = document.getElementById('btnAnalyze');
            const resultPanel = document.getElementById('resultPanel');
            const badge = document.getElementById('badgeVerdict');
            const diagnosisText = document.getElementById('diagnosisText');

            if (!apiKey) {
                alert('Por favor, insira uma chave de API válida para realizar a checagem.');
                return;
            }
            if (!text) {
                alert('Por favor, digite ou cole um texto para analisar.');
                return;
            }

            btn.innerText = '⏳ Consultando Inteligência Artificial...';
            btn.disabled = true;

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [
                            {
                                role: 'system',
                                content: 'Você é um checador de fatos profissional. Analise o texto fornecido e determine se é FALSO, VERDADEIRO ou IMPRECISO. Responda no seguinte formato exato na primeira linha: [VEREDITO: FALSO], [VEREDITO: VERDADEIRO] ou [VEREDITO: IMPRECISO]. Nas linhas seguintes, explique detalhadamente os motivos da checagem.'
                            },
                            {
                                role: 'user',
                                content: text
                            }
                        ]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    alert('Erro na API: ' + data.error.message);
                    return;
                }

                const aiResponse = data.choices[0].message.content;
                resultPanel.style.display = 'block';

                if (aiResponse.includes('[VEREDITO: FALSO]')) {
                    badge.className = 'badge badge-danger';
                    badge.innerText = '🔴 ALTA PROBABILIDADE DE FAKE NEWS';
                } else if (aiResponse.includes('[VEREDITO: VERDADEIRO]')) {
                    badge.className = 'badge badge-success';
                    badge.innerText = '🟢 INFORMAÇÃO CONFIÁVEL / VERDADEIRA';
                } else {
                    badge.className = 'badge badge-warning';
                    badge.innerText = '🟡 INFORMAÇÃO SUSPEITA OU IMPRECISA';
                }

                diagnosisText.innerText = aiResponse.replace(/\[VEREDITO: .*?\]/, '').trim();

            } catch (err) {
                alert('Erro ao conectar com o serviço de checagem: ' + err.message);
            } finally {
                btn.innerText = '🔍 ANALISAR AGORA COM IA';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
